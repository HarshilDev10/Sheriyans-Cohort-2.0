<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id & Classes</title>
</head>
<style>

.ready{                    /* Classes denoted by . */
    color: aqua;
}

#hero{                     /* IDs denoted by # */
    color: red;
}

</style>
<body>

    <h1 id="hero">Hello Harshil!</h1>

    <h1 class="ready">Are you Ready?</h1>

    <h1 id="hero">Let's start the class.</h1>
    
</body>
</html>
