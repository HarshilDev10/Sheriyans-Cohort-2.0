<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
</head>
<style>
    
    #box1{
        height: 200px;
        width: 200px;
        margin-bottom: 15px;
        background: linear-gradient(to right, red ,blue 20%);
    }

    #box2{
        height: 200px;
        width: 200px;
        background: radial-gradient(red,blue);
    }

    #box3{
        height: 200px;
        width: 200px;
        margin-top: 15px;
        background: conic-gradient(violet,indigo,blue,green,yellow,orange,red,violet);
    }

</style>
<body>
    <div id="box1"></div>

    <div id="box2"></div>

    <div id="box3"></div>
</body>
</html>
