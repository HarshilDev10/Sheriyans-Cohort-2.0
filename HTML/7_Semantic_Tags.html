<!DOCTYPE html> <!-- <!DOCTYPE html> is a document type declaration that tells the browser which version of HTML the webpage is using.[ Doctype used for html5 ] -->
<!-- 
Why is it used?
Tells the browser to render the page in Standards Mode.
Ensures the browser follows the HTML5 specification.
Prevents browsers from using Quirks Mode, which emulates older browser behavior and can cause inconsistent layouts.
 -->

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags</title>
</head>
<body>
    <!-- Semantic Tags : Used for SEO Optimization , They are tags which specify some meaning. -->
</body>
</html>


<!-- 

Semantic Tags are HTML tags that clearly describe the meaning and purpose of the content they contain, making web pages easier for browsers, search engines, and developers to understand.

Why use Semantic Tags?
Improve code readability
Improve SEO (Search Engine Optimization)
Enhance accessibility for screen readers
Provide a meaningful page structure
Easier to maintain than using only <div> elements
    
<header>      - Defines the introductory section of a webpage.
<nav>         - Contains navigation links or menus.
<main>        - Represents the main content of the page.
<section>     - Groups related content into a section.
<article>     - Represents independent, self-contained content.
<aside>       - Contains sidebar or supplementary content.
<footer>      - Defines the footer of a page or section.
<figure>      - Groups media such as images or diagrams.
<figcaption>  - Provides a caption for a figure.
<time>        - Represents a date or time.
<details>     - Creates expandable content.
<summary>     - Defines the heading for a details element.
<mark>        - Highlights important text.
<address>     - Specifies contact information.

-->
