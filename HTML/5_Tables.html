<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>
</head>
<body>
    <table border="2">
        <caption>Student Table</caption> <!-- Provides Heading of the tabe -->

        <thead> <!-- Semantic tags for table header -->
            <tr> <!-- Table Row -->
                <th>ID</th> <!-- Table Heading -->
                <th>Name</th>
                <th>Age</th>
                <th>Station</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody> <!-- Semantic tags for table body -->

            <tr>
                <td>1</td> <!-- Table Data -->
                <td>Harshil</td>
                <td rowspan="2">18</td>
                <td colspan="2">Vapi</td>
            </tr>
        </tbody>
        <tfoot> <!-- Semantic tags for table footer -->
            <tr>
                <td>2</td>
                <td>Jay</td>
                <td>Bhilad</td>
                <td>Kalgam</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
