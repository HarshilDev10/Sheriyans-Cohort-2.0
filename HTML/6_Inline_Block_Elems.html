<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline & Block Elements</title>
</head>
<body>
    <dl>
        <dt>Term</dt>
        <dd>Hello is this term.</dd>
    </dl>
</body>
</html>

<!-- Most Used Block Elements -->

<!-- 
INLINE ELEMENTS - Occupies only req width.

<a>         - Creates hyperlinks.
<span>      - Generic inline container.
<img>       - Displays an image.
<strong>    - Indicates strong importance.
<b>         - Makes text bold.
<em>        - Adds emphasis.
<i>         - Displays italic text.
<u>         - Underlines text.
<small>     - Displays smaller text.
<mark>      - Highlights text.
<sub>       - Displays subscript text.
<sup>       - Displays superscript text.
<code>      - Displays code snippets.
<kbd>       - Represents keyboard input.
<samp>      - Displays sample output.
<var>       - Represents a variable.
<q>         - Defines a short quotation.
<cite>      - References a source.
<abbr>      - Defines an abbreviation.
<time>      - Represents date or time.
<label>     - Labels form controls.
<input>     - Accepts user input.
<button>    - Creates a clickable button.
<select>    - Creates a dropdown list.
<textarea>  - Allows multi-line text input.
<br>        - Inserts a line break.

BLOCK ELEMENTS - Occupies full viewport width.

<div>         - Generic block container.
<p>           - Defines a paragraph.
<h1>–<h6>     - Defines headings.
<section>     - Groups related content.
<article>     - Represents independent content.
<aside>       - Contains sidebar content.
<header>      - Defines a page header.
<footer>      - Defines a page footer.
<nav>         - Contains navigation links.
<main>        - Holds the main content.
<figure>      - Groups media content.
<figcaption>  - Provides a figure caption.
<blockquote>  - Displays a block quotation.
<pre>         - Preserves formatted text.
<hr>          - Inserts a thematic break.
<ul>          - Creates an unordered list.
<ol>          - Creates an ordered list.
<li>          - Defines a list item.
<dl>          - Creates a description list.
<dt>          - Defines a description term.
<dd>          - Defines a description detail.
<table>       - Creates a table.
<thead>       - Groups table headers.
<tbody>       - Groups table body rows.
<tfoot>       - Groups table footer rows.
<tr>          - Defines a table row.
<th>          - Defines a header cell.
<td>          - Defines a table data cell.
<form>        - Creates an HTML form.
<fieldset>    - Groups related form fields.
<legend>      - Provides a fieldset caption.
<address>     - Displays contact information.
<details>     - Creates expandable content.
<summary>     - Defines the details heading.
<canvas>      - Draws graphics with JavaScript.
<video>       - Embeds a video.
<audio>       - Embeds audio content.    
 -->
