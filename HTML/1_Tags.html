<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tags</title>
</head>
<body>
    <!--Heading Tags-->
    <h1>Hello</h1>
    <h2>Hello</h2>
    <h3>Hello</h3>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>

    <!-- Paragraph Tag -->
     <p>This is Paragraph</p>
     <pre>   This is PARAGRAPH</pre>

    <!-- Bold, Italic, Underline -->
     <b>Harshil</b>
     <br> <!-- Line Break Tag -->
     <i>Harshil</i>
     <br>
     <u>Harshil</u>

     <!-- Superscript & Subscript -->
      <p>2<sup>2</sup> = 4</p>
      <p>H<sub>2</sub>O</p>

    <!-- Ordered List & Unordered List -->
     <ol type="1">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
     </ol>
     <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
     </ul>

     <!-- Horizontal Rule Tag -->
      <hr>

     <!-- Anchor Tag -->
      <a href="https://www.sheryians.com/" target="_blank">Visit Sheriyans</a><br>  

    <!-- Media Tags (Image, Video, Audio) -->

    <img height="200" src="./image.jpg" alt="Image Not Found"/><br>
    <video autoplay loop muted height="200" controls src="./video.mp4" alt="Video not found"></video><br>
    <audio controls src="./audio.mp3"></audio><br>

    <!-- Iframes Tag -->
     <iframe height="600" src="https://www.sheryians.com/"></iframe>


</body>
</html>
