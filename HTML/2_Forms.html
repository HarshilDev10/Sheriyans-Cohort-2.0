<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <form>

        <!-- Input Tags -->
        <input required type="text" placeholder="Enter your name"><br>

        <input required type="email" placeholder="Enter your email"><br>

        <input required type="password" placeholder="Enter your password"><br>

        <!-- Label Tags -->
        <input id="terms" type="checkbox">
        <label for="terms"> Agree terms and conditions </label><br>

        <input type="datetime-local"><br>

        <input type="week"><br>

        <input type="month"><br>

        <input name="gender" id="Male" type="radio">
        <label for="Male">Male</label>

        <input name="gender" id="Female" type="radio">
        <label for="Female">Female</label><br>

        <!-- Button Tags -->
        <button>Submit</button>
        <input type="reset" value="Reset">

    </form>
</body>
</html>
